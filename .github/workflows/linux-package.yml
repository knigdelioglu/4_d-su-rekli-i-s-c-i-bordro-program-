name: Linux Packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux x86_64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install WebAssembly toolchain
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build and verify browser assets
        run: |
          bun run wasm:build
          bun run verify:wasm-package
          bun run verify:wasm-freshness

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked

      - name: Build Debian and AppImage packages
        run: cargo tauri build --config src-tauri/tauri.conf.json --bundles deb,appimage

      - name: Verify Linux packages
        run: |
          set -euo pipefail
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"
          dpkg-deb --info "$deb"
          mkdir -p "$RUNNER_TEMP/linux-packages"
          cp "$deb" "$appimage" "$RUNNER_TEMP/linux-packages/"
          chmod +x "$RUNNER_TEMP/linux-packages/$(basename "$appimage")"
          file "$appimage"

      - name: Upload install packages
        uses: actions/upload-artifact@v4
        with:
          name: 4D-Bordro-Programi-Linux-x86_64
          path: ${{ runner.temp }}/linux-packages/*
          if-no-files-found: error
          retention-days: 14
