name: Fix CI regressions

on:
  push:
    branches:
      - agent/fix-ci-regressions

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fix-ci-regressions
          fetch-depth: 0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false

      - name: Apply fixture and lint cleanup
        run: python3 .github/scripts/fix_ci_regressions.py

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt

      - name: Commit generated cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "test: align fixtures and rust formatting"
          git push origin HEAD:agent/fix-ci-regressions
