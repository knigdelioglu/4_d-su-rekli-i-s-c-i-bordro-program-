name: Native smoke attendance fixture repair

on:
  push:
    branches:
      - agent/fix-native-smoke-attendance

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-native-smoke-attendance
          fetch-depth: 0
      - name: Apply fixture patch
        run: python3 .github/scripts/fix_native_smoke_attendance.py
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - name: Format Rust tests
        run: cargo fmt
        working-directory: src-tauri
      - name: Commit repaired fixture
        run: |
          rm .github/scripts/fix_native_smoke_attendance.py
          rm .github/workflows/fix-native-smoke-attendance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: use real 15-14 dates in native smoke fixture"
          git push origin HEAD:agent/fix-native-smoke-attendance
