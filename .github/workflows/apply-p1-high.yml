name: Apply P1-high hardening

on:
  push:
    branches:
      - agent/complete-p1-high-hardening
    paths:
      - .github/workflows/apply-p1-high.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/complete-p1-high-hardening

      - name: Apply source changes
        run: python .github/scripts/apply_p1_high.py

      - name: Setup Rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false

      - name: Format Rust sources
        working-directory: src-tauri
        run: cargo fmt

      - name: Restore normal CI and remove one-shot files
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
            pull_request:

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Bun
                  uses: oven-sh/setup-bun@v2
                  with:
                    bun-version: latest

                - name: Install JavaScript dependencies
                  run: bun install --frozen-lockfile

                - name: TypeScript lint
                  run: bun run lint

                - name: Bun tests
                  run: bun test

                - name: Vite build
                  run: bun run build

                - name: Install Tauri Linux dependencies
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      build-essential \
                      curl \
                      wget \
                      file \
                      libxdo-dev \
                      libssl-dev \
                      libayatana-appindicator3-dev \
                      librsvg2-dev \
                      patchelf

                - name: Setup Rust
                  uses: actions-rust-lang/setup-rust-toolchain@v1
                  with:
                    toolchain: stable
                    components: rustfmt, clippy
                    cache: false

                - name: Rust cache
                  uses: Swatinem/rust-cache@v2
                  with:
                    workspaces: './src-tauri -> target'
                    cache-on-failure: true

                - name: Rust format check
                  working-directory: src-tauri
                  run: cargo fmt --check

                - name: Rust clippy
                  working-directory: src-tauri
                  run: cargo clippy --all-targets --all-features -- -D warnings

                - name: Rust tests
                  working-directory: src-tauri
                  run: cargo test
          YAML
          rm -f .github/scripts/apply_p1_high.py .github/workflows/apply-p1-high.yml

      - name: Commit completed P1-high work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "complete P1-high payroll hardening"
          git push origin HEAD:agent/complete-p1-high-hardening
