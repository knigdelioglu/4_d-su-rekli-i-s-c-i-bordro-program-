name: Fix legacy attendance fixture

on:
  push:
    branches:
      - agent/complete-remaining-p1-hardening
    paths:
      - .github/workflows/fix-attendance-tax-slot-fixture.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-remaining-p1-hardening
          fetch-depth: 0

      - name: Give alternate attendance period a distinct tax slot
        run: >-
          python -c 'from pathlib import Path; p=Path("src-tauri/tests/domain_tests.rs"); text=p.read_text(encoding="utf-8"); needle="id: \"2026-05-alt\".into(),"; pos=text.index(needle); start=text.rfind("let donem_b = BordroDonemi {", 0, pos); end=text.index("};", pos)+2; segment=text[start:end]; old="taxMonth: 6,"; assert old in segment, "target tax slot not found"; segment=segment.replace(old, "taxMonth: 5,", 1); p.write_text(text[:start]+segment+text[end:], encoding="utf-8")'

      - name: Commit fixture repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-attendance-tax-slot-fixture.yml
          git add src-tauri/tests/domain_tests.rs
          git commit -m "test: use unique tax slot in attendance fixture"
          git push origin HEAD:agent/complete-remaining-p1-hardening
