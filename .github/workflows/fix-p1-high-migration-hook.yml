name: Make statutory snapshot migration idempotent

on:
  push:
    branches:
      - agent/complete-p1-high-hardening
    paths:
      - .github/workflows/fix-p1-high-migration-hook.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-p1-high-hardening

      - name: Replace marker with idempotent migration hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/db/migrations.rs')
          s = p.read_text()
          old = '''        // The additive column itself is installed by ensure_optional_columns() via
                  // add_column_if_missing(). Keep this migration as a version marker so databases
                  // that already received the column through a repair/pre-release path do not fail
                  // with a duplicate-column ALTER TABLE during normal migration replay.
                  M::up("SELECT 1;"),'''
          new = '''        // Keep this migration self-contained for callers that use get_migrations()
                  // directly, while remaining safe for pre-release databases that already have the
                  // additive column. The hook runs in the migration transaction after the no-op SQL.
                  M::up_with_hook("SELECT 1;", |tx| {
                      let exists: i64 = tx.query_row(
                          "SELECT COUNT(*) FROM pragma_table_info('payroll_records') WHERE name = 'statutory_snapshot_json'",
                          [],
                          |row| row.get(0),
                      )?;
                      if exists == 0 {
                          tx.execute(
                              "ALTER TABLE payroll_records ADD COLUMN statutory_snapshot_json TEXT",
                              [],
                          )?;
                      }
                      Ok(())
                  }),'''
          if old not in s:
              raise SystemExit('expected migration marker not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Setup Rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false

      - name: Format
        working-directory: src-tauri
        run: cargo fmt

      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-p1-high-migration-hook.yml

      - name: Commit migration hook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix statutory snapshot migration compatibility"
          git push origin HEAD:agent/complete-p1-high-hardening
