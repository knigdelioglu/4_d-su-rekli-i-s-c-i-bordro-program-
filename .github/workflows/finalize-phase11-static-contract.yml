name: Finalize Phase 11 Static Contract

on:
  push:
    branches:
      - agent/phase11-manual-tediye-tis
    paths:
      - .github/workflows/finalize-phase11-static-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/phase11-manual-tediye-tis
          fetch-depth: 0

      - name: Apply static contract cleanup
        run: python3 scripts/finalize_phase11_static_contract.py

      - name: Commit final static tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove remaining automatic Tediye and TIS fallback"
          git push origin HEAD:agent/phase11-manual-tediye-tis
