name: Sync WASM PR7

on:
  push:
    branches:
      - fix/multiple-supplementary-accrual-rows

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/multiple-supplementary-accrual-rows

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          cache: false

      - name: Install WebAssembly toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Regenerate committed WASM
        run: |
          set -euo pipefail
          wasm-pack build crates/payroll-wasm --target web --out-dir ../../src/wasm/pkg --release --no-opt --no-typescript
          rm -f src/wasm/pkg/.gitignore

      - name: Commit synchronized output when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- src/wasm/pkg && [ -z "$(git status --porcelain --untracked-files=all -- src/wasm/pkg)" ]; then
            echo "WASM output is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wasm/pkg
          git commit -m "Sync generated WASM with CI toolchain"
          git push origin HEAD:fix/multiple-supplementary-accrual-rows
