name: Audit follow-up hardening branch

on:
  push:
    paths:
      - '.github/workflows/audit-followups-branch.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt
          cache: false

      - name: Install WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          install_log="${RUNNER_TEMP}/bun-install.log"
          if bun install --frozen-lockfile 2>&1 | tee "${install_log}"; then
            rm -f "${install_log}"
            exit 0
          fi
          if ! grep -Eqi 'tarball|extract|download|ECONNRESET|ETIMEDOUT|EAI_AGAIN|network' "${install_log}"; then
            exit 1
          fi
          bun pm cache rm
          bun install --frozen-lockfile

      - name: Apply vetted structural patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          workflow = Path('.github/workflows/one-time-payroll-hardening-v2.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit('embedded hardening script start not found')
          start += len(start_marker)
          end = workflow.find("\n          PY\n", start)
          if end < 0:
              raise SystemExit('embedded hardening script end not found')
          Path('/tmp/apply_hardening.py').write_text(dedent(workflow[start:end]))
          PY
          python3 /tmp/apply_hardening.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('crates/payroll-core/tests/retro_tax_oks_followup_20260909.rs')
          text = path.read_text()
          support_needle = '#[path = "support/independent_audit.rs"]\nmod support;'
          support_replacement = '#[allow(dead_code)]\n#[path = "support/independent_audit.rs"]\nmod support;'
          if support_needle not in text:
              raise SystemExit('retro follow-up support module anchor not found')
          text = text.replace(support_needle, support_replacement, 1)
          chronology_needle = '    let mut payment = support::dated_request(2026, 2);\n    let payment_normal = calculate_payroll_checked(&payment).unwrap();\n    payment.dataset.payrolls.push(payment_normal);\n    payment.dataset.periods.extend(source.dataset.periods.clone());\n    payment.dataset.institutionSettings.extend(source.dataset.institutionSettings.clone());\n    payment.dataset.attendances.extend(source.dataset.attendances.clone());\n    payment.dataset.payrolls.push(original);\n'
          chronology_replacement = '    let mut payment = support::dated_request(2026, 2);\n    payment.dataset.periods.extend(source.dataset.periods.clone());\n    payment.dataset.institutionSettings.extend(source.dataset.institutionSettings.clone());\n    payment.dataset.attendances.extend(source.dataset.attendances.clone());\n    payment.dataset.payrolls.push(original);\n    let payment_normal = calculate_payroll_checked(&payment).unwrap();\n    payment.dataset.payrolls.push(payment_normal);\n'
          if chronology_needle not in text:
              raise SystemExit('retro meal chronology anchor not found')
          path.write_text(text.replace(chronology_needle, chronology_replacement, 1))
          PY

      - name: Format Rust changes
        run: cargo fmt --all

      - name: Run targeted core regressions
        run: |
          cargo test -p payroll-core --test independent_audit_20260908
          cargo test -p payroll-core --test retro_tax_oks_followup_20260909

      - name: Run native reconciliation regressions
        run: cargo test -p bordro-programi --test snapshot_reconciliation_20260909

      - name: Run browser semantic regression
        run: bun test src/services/storage/payrollPayloadSchema.semantic.test.ts

      - name: Rebuild committed browser WASM
        run: bun run wasm:build

      - name: Verify WASM package
        run: |
          bun run verify:wasm-package
          bun run wasm:test

      - name: Commit branch changes
        shell: bash
        run: |
          rm -f .github/workflows/audit-followups-branch.yml
          rm -f .github/workflows/one-time-payroll-hardening.yml
          rm -f .github/workflows/one-time-payroll-hardening-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden payroll validation and retro audit follow-ups'
          git push origin HEAD:agent/fix-audit-followups-20260909
