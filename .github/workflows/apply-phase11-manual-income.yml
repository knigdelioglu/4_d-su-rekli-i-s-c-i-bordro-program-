name: Apply Phase 11 Manual Income

on:
  push:
    branches:
      - agent/phase11-manual-tediye-tis
    paths:
      - .github/workflows/apply-phase11-manual-income.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/phase11-manual-tediye-tis
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/apply_phase11_manual_income.py

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit final Phase 11 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make Tediye and TIS manual payroll inputs"
          git push origin HEAD:agent/phase11-manual-tediye-tis
