name: Apply remaining P1 patch

on:
  push:
    branches:
      - agent/complete-remaining-p1-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and apply staged patch
        shell: bash
        run: |
          cat .github/p1patch/chunk_* > /tmp/apply_p1.py
          python -m py_compile /tmp/apply_p1.py
          python /tmp/apply_p1.py

      - name: Remove temporary patch machinery
        shell: bash
        run: |
          rm -rf .github/p1patch
          rm -f .github/workflows/apply-p1-patch.yml

      - name: Commit applied P1 code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: complete remaining P1 payroll hardening"
          git push origin HEAD:agent/complete-remaining-p1-hardening
