name: Repair P1-high migration idempotency

on:
  push:
    branches:
      - agent/complete-p1-high-hardening
    paths:
      - .github/workflows/fix-p1-high-migration.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-p1-high-hardening
      - name: Make snapshot migration idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/db/migrations.rs')
          s = p.read_text()
          old = '''        M::up(
                      r#"\n            ALTER TABLE payroll_records ADD COLUMN statutory_snapshot_json TEXT;\n            "#,
                  ),'''
          if old not in s:
              raise SystemExit('expected statutory snapshot migration block not found')
          new = '''        // The additive column itself is installed by ensure_optional_columns() via
                  // add_column_if_missing(). Keep this migration as a version marker so databases
                  // that already received the column through a repair/pre-release path do not fail
                  // with a duplicate-column ALTER TABLE during normal migration replay.
                  M::up("SELECT 1;"),'''
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-p1-high-migration.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix P1-high migration idempotency"
          git push origin HEAD:agent/complete-p1-high-hardening
