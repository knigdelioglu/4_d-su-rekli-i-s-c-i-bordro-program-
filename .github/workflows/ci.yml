name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: false

      - name: Install WebAssembly toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust workspace check
        run: cargo check --workspace

      - name: Shared core tests
        run: cargo test -p payroll-core

      - name: Build browser WASM package
        run: bun run wasm:build

      - name: Verify committed WASM is synchronized with Rust source
        run: |
          if ! git diff --quiet -- src/wasm/pkg; then
            echo "::error::Generated WASM drift detected in src/wasm/pkg. Run 'bun run wasm:build' and commit the generated output together with payroll-core changes."
            git diff --stat -- src/wasm/pkg
            exit 1
          fi
          echo "Generated WASM matches the committed Rust/WASM source output."

      - name: WASM adapter tests
        run: bun run wasm:test

      - name: TypeScript lint
        run: bun run lint

      - name: Bun tests
        run: bun test

      - name: Vite build
        run: bun run build

      - name: Verify production web output
        run: bun run web:verify

      - name: Verify browser privacy boundary
        run: bun run verify:privacy

      - name: Typecheck browser E2E tests
        run: bun run test:e2e:typecheck

      - name: Browser E2E smoke tests
        run: bun run test:e2e

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust workspace tests
        run: cargo test --workspace
