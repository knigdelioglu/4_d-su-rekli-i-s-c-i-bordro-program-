name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node for Netlify CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          install_log="${RUNNER_TEMP}/bun-install.log"
          if bun install --frozen-lockfile 2>&1 | tee "${install_log}"; then
            rm -f "${install_log}"
            exit 0
          fi

          if ! rg -qi 'tarball|extract|download|ECONNRESET|ETIMEDOUT|EAI_AGAIN|network' "${install_log}"; then
            echo "Bun dependency installation failed for a non-transient reason; not retrying." >&2
            exit 1
          fi

          echo "Initial Bun install failed during package download/extraction; clearing Bun cache and retrying once..." >&2
          bun pm cache rm
          bun install --frozen-lockfile
          rm -f "${install_log}"

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: false

      - name: Install WebAssembly toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust workspace check
        run: cargo check --workspace

      - name: Shared core tests
        run: cargo test -p payroll-core

      - name: Build browser WASM package
        run: bun run wasm:build

      - name: Verify generated WASM package allowlist
        run: bun run verify:wasm-package

      - name: Verify committed WASM is synchronized with Rust source
        run: |
          wasm_status="$(git status --porcelain --untracked-files=all -- src/wasm/pkg)"
          if [ -n "$wasm_status" ]; then
            echo "::error::Generated WASM drift detected in src/wasm/pkg. Run 'bun run wasm:build' and commit the generated output together with payroll-core changes."
            echo "$wasm_status"
            exit 1
          fi
          echo "Generated WASM matches the committed Rust/WASM source output, including tracked and untracked files."

      - name: WASM adapter tests
        run: bun run wasm:test

      - name: TypeScript lint
        run: bun run lint

      - name: Bun tests
        run: bun test

      - name: Vite build
        run: bun run build

      - name: Verify production web output
        run: bun run web:verify

      - name: Verify browser privacy boundary
        run: bun run verify:privacy

      - name: Typecheck browser E2E tests
        run: bun run test:e2e:typecheck

      - name: Browser E2E smoke tests
        run: bun run test:e2e

      - name: Netlify runtime header and browser smoke test
        run: bun run test:netlify-smoke

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust workspace tests
        run: cargo test --workspace
