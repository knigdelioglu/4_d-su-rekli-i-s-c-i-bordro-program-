name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ONE_SHOT_FIX_START
      - name: Apply one-shot Rust fixture migration
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout "${GITHUB_HEAD_REF}"
          git reset --hard "origin/${GITHUB_HEAD_REF}"
          python3 scripts/one_shot_test_fixture_migration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate legacy Rust test fixtures"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          exit 0
      # ONE_SHOT_FIX_END

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript lint
        run: bun run lint

      - name: Bun tests
        run: bun test

      - name: Vite build
        run: bun run build

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache-workspaces: "src-tauri -> target"

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
