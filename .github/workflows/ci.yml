name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node for Netlify CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          install_log="${RUNNER_TEMP}/bun-install.log"
          if bun install --frozen-lockfile 2>&1 | tee "${install_log}"; then
            rm -f "${install_log}"
            exit 0
          fi

          if ! grep -Eqi 'tarball|extract|download|ECONNRESET|ETIMEDOUT|EAI_AGAIN|network' "${install_log}"; then
            echo "Bun dependency installation failed for a non-transient reason; not retrying." >&2
            exit 1
          fi

          echo "Initial Bun install failed during package download/extraction; clearing Bun cache and retrying once..." >&2
          bun pm cache rm
          bun install --frozen-lockfile
          rm -f "${install_log}"

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: false

      - name: Install WebAssembly toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust workspace check
        run: cargo check --workspace

      - name: Shared core tests
        run: cargo test -p payroll-core

      - name: Golden payroll corpus
        run: cargo test -p payroll-core --test golden_payroll_corpus

      - name: Property and oracle differential tests
        run: cargo test -p payroll-core --test property_tests

      - name: Build browser WASM package
        run: bun run wasm:build

      - name: Verify generated WASM package allowlist
        run: bun run verify:wasm-package

      - name: Verify generated WASM package
        run: |
          # The release WASM contains panic-location metadata with absolute
          # toolchain source paths, so its bytes can legitimately vary by
          # runner. Source freshness, the package allowlist, adapter tests,
          # browser tests, and the production build verify the artifact.
          wasm_status="$(git status --porcelain --untracked-files=all -- src/wasm/pkg)"
          unexpected_status="$(printf '%s\n' "$wasm_status" | awk '
            $1 == "M" && $2 == "src/wasm/pkg/payroll_wasm_bg.wasm" { next }
            NF { print }
          ')"
          if [ -n "$unexpected_status" ]; then
            echo "::error::Unexpected generated WASM package drift detected in src/wasm/pkg."
            echo "$unexpected_status"
            exit 1
          fi
          if [ -n "$wasm_status" ]; then
            echo "Generated WASM binary differs only in runner-specific path metadata; all synchronized package checks passed."
          else
            echo "Generated WASM package is unchanged."
          fi

      - name: WASM adapter tests
        run: bun run wasm:test

      - name: TypeScript lint
        run: bun run lint

      - name: Verify generated Rust to TypeScript payroll contract
        run: bun run verify:payroll-contract

      - name: Bun tests
        run: bun test

      - name: Vite build
        run: bun run build

      - name: Verify production web output
        run: bun run web:verify

      - name: Verify browser privacy boundary
        run: bun run verify:privacy

      - name: Typecheck browser E2E tests
        run: bun run test:e2e:typecheck

      - name: Browser E2E smoke tests
        run: bun run test:e2e

      - name: Netlify runtime header and browser smoke test
        run: bun run test:netlify-smoke

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust workspace tests
        run: cargo test --workspace

  rust-coverage:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      # Measurement runs must be reproducible; the normal PR property suite
      # intentionally does not inherit this seed.
      PROPTEST_RNG_SEED: "2026091001"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
          cache: false

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Measure payroll-core coverage
        run: |
          mkdir -p artifacts
          cargo llvm-cov \
            --package payroll-core \
            --all-features \
            --json \
            --summary-only \
            --output-path artifacts/payroll-core-coverage.json

      - name: Enforce critical module coverage ratchet
        run: node scripts/check-rust-coverage.mjs artifacts/payroll-core-coverage.json docs/payroll-coverage-baseline.json

      - name: Upload payroll coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payroll-core-coverage
          path: artifacts/payroll-core-coverage.json
          if-no-files-found: warn

  rust-mutation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      # Keep mutation quality measurements stable without restricting normal
      # PR property-test exploration.
      PROPTEST_RNG_SEED: "2026091001"
    strategy:
      fail-fast: false
      matrix:
        # cargo-mutants uses zero-based shard indices (0/8 through 7/8).
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          cache: false

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked

      - name: Run payroll-core mutation shard
        run: |
          set -euo pipefail
          set +e
          cargo mutants \
            --manifest-path crates/payroll-core/Cargo.toml \
            --package payroll-core \
            --shard "${{ matrix.shard }}/8" \
            --jobs 2 \
            --no-shuffle
          mutation_status=$?
          set -e

          # cargo-mutants uses these exit codes for completed quality findings.
          # All other codes represent an infrastructure or baseline failure.
          case "$mutation_status" in
            0|2|3)
              ;;
            *)
              echo "::error::cargo-mutants infrastructure failure (exit $mutation_status)."
              exit "$mutation_status"
              ;;
          esac

          tool_output="target/mutants.out"
          canonical_output="target/cargo-mutants"
          if [ ! -f "$tool_output/outcomes.json" ]; then
            echo "::error::cargo-mutants completed without $tool_output/outcomes.json."
            exit 1
          fi
          if [ -e "$canonical_output" ]; then
            echo "::error::Canonical mutation output already exists: $canonical_output"
            exit 1
          fi
          mkdir -p "$(dirname "$canonical_output")"
          mv "$tool_output" "$canonical_output"
          test -f "$canonical_output/outcomes.json"

      - name: Summarize mutation shard
        if: always()
        run: |
          set -euo pipefail
          outcomes="target/cargo-mutants/outcomes.json"
          test -f "$outcomes"
          node scripts/summarize-cargo-mutants.mjs "$outcomes" > target/cargo-mutants/shard-summary.json
          cat target/cargo-mutants/shard-summary.json

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payroll-core-mutants-shard-${{ matrix.shard }}
          path: target/cargo-mutants
          if-no-files-found: error

  rust-mutation-summary:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    needs: rust-mutation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Download mutation shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: payroll-core-mutants-shard-*
          path: artifacts/mutation
          merge-multiple: false

      - name: Aggregate mutation evidence
        if: always()
        run: |
          set -euo pipefail
          shard_job_result="${{ needs.rust-mutation.result }}"
          if [ "$shard_job_result" != "success" ]; then
            echo "::warning::Mutation shard job sonucu $shard_job_result; exact artifact doğrulaması yine çalıştırılıyor."
          fi
          mkdir -p artifacts
          outcomes=()
          for shard in 0 1 2 3 4 5 6 7; do
            path="artifacts/mutation/payroll-core-mutants-shard-${shard}/target/cargo-mutants/outcomes.json"
            if [ ! -f "$path" ]; then
              echo "::error::Expected mutation shard artifact is missing: $path"
              exit 1
            fi
            outcomes+=("$path")
          done
          summary_tmp="artifacts/payroll-core-mutation-summary.json.tmp"
          node scripts/summarize-cargo-mutants.mjs \
            --expected-shards 8 \
            --baseline docs/payroll-mutation-baseline.json \
            "${outcomes[@]}" > "$summary_tmp"
          mv "$summary_tmp" artifacts/payroll-core-mutation-summary.json
          cat artifacts/payroll-core-mutation-summary.json
          if [ "$shard_job_result" != "success" ]; then
            echo "::error::At least one mutation shard failed infrastructure validation."
            exit 1
          fi

      - name: Upload aggregate mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payroll-core-mutation-summary
          path: artifacts/payroll-core-mutation-summary.json
          if-no-files-found: error
