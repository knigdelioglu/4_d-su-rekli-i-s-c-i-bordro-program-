name: Short-period SGK day repair

on:
  push:
    branches:
      - agent/fix-short-period-sgk-days

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-short-period-sgk-days
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/fix_short_period_sgk_days.py
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - name: Format Rust
        run: cargo fmt
        working-directory: src-tauri
      - name: Commit repaired implementation
        run: |
          rm .github/scripts/fix_short_period_sgk_days.py
          rm .github/workflows/fix-short-period-sgk-days.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize SGK PEK days for short 15-14 periods"
          git push origin HEAD:agent/fix-short-period-sgk-days
