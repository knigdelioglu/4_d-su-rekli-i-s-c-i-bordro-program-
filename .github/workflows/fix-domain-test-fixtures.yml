name: Domain fixture repair

on:
  push:
    branches:
      - agent/fix-domain-test-attendance-fixtures

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-domain-test-attendance-fixtures
          fetch-depth: 0
      - run: python3 .github/scripts/fix_domain_test_fixtures.py
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - run: cargo fmt
        working-directory: src-tauri
      - name: Commit repaired fixtures
        run: |
          rm .github/scripts/fix_domain_test_fixtures.py
          rm .github/workflows/fix-domain-test-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align domain attendance fixtures with period invariant"
          git push origin HEAD:agent/fix-domain-test-attendance-fixtures
