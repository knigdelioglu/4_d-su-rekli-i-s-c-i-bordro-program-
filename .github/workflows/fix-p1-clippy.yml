name: Fix remaining P1 clippy

on:
  push:
    branches:
      - agent/complete-remaining-p1-hardening
    paths:
      - .github/workflows/fix-p1-clippy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-remaining-p1-hardening
          fetch-depth: 0

      - name: Fix clippy-only regression test issue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/tests/p1_remaining_hardening_regression_test.rs')
          text = p.read_text(encoding='utf-8')
          old = '''    let mut settings = DonemselKurumDegerleri::default();\n    settings.pekTavanKatsayisi = Some(dec!(0.5));\n'''
          new = '''    let settings = DonemselKurumDegerleri {\n        pekTavanKatsayisi: Some(dec!(0.5)),\n        ..DonemselKurumDegerleri::default()\n    };\n'''
          if old not in text:
              raise SystemExit('expected clippy test marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Restore normal CI and remove this workflow
        shell: bash
        run: |
          git show 603eed97004921840a99620b597759b174854d83:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/fix-p1-clippy.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: fix remaining P1 clippy regression"
          git push origin HEAD:agent/complete-remaining-p1-hardening
