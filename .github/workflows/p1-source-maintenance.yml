name: P1 source maintenance

on:
  push:
    branches:
      - agent/complete-remaining-p1-hardening
    paths:
      - .github/workflows/p1-source-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-remaining-p1-hardening
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false

      - name: Apply static source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          period = Path('src-tauri/src/repositories/period_repo.rs')
          text = period.read_text(encoding='utf-8')
          text = text.replace('use crate::domain::Result;\n', 'use crate::domain::{DomainError, Result};\n', 1)
          period.write_text(text, encoding='utf-8')

          additions = '''        dogumAskerlikGvIndirimi: dec!(0),\n        sigortaGvIndirimAdayi: dec!(0),\n        sigortaGvAylikLimiti: dec!(0),\n        sigortaGvYillikKalanLimiti: dec!(0),\n        uygulanabilirSigortaGvIndirimi: dec!(0),\n'''
          p = Path('src-tauri/tests/cumulative_gv_stale_chain_regression_test.rs')
          text = p.read_text(encoding='utf-8')
          marker = '        kesilenGelirVergisi: dec!(0),\n'
          if 'dogumAskerlikGvIndirimi' not in text:
              text = text.replace(marker, marker + additions, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('src-tauri/tests/domain_tests.rs')
          text = p.read_text(encoding='utf-8')
          if text.count('dogumAskerlikGvIndirimi: dec!(0),') < 2:
              text = text.replace(
                  '            kesilenGelirVergisi: dec!(0),\n',
                  '            kesilenGelirVergisi: dec!(0),\n'
                  '            dogumAskerlikGvIndirimi: dec!(0),\n'
                  '            sigortaGvIndirimAdayi: dec!(0),\n'
                  '            sigortaGvAylikLimiti: dec!(0),\n'
                  '            sigortaGvYillikKalanLimiti: dec!(0),\n'
                  '            uygulanabilirSigortaGvIndirimi: dec!(0),\n',
                  2,
              )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Format Rust sources
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Remove temporary audit and maintenance workflows
        run: |
          rm -f ../.github/workflows/p1-static-audit.yml
          rm -f ../.github/workflows/p1-source-maintenance.yml

      - name: Commit source maintenance
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair remaining P1 source compatibility"
          git push origin HEAD:agent/complete-remaining-p1-hardening
