name: One-shot Rustfmt

on:
  push:
    branches:
      - tmp/rustfmt-once-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/rustfmt-once-v2
          fetch-depth: 0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false

      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt

      - name: Verify rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Remove one-shot workflow and commit formatting
        run: |
          rm .github/workflows/rustfmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply rustfmt"
          git push origin HEAD:tmp/rustfmt-once-v2
