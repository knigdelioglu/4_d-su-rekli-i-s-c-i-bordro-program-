name: Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          $installLog = Join-Path $env:RUNNER_TEMP "bun-install.log"
          $installOutput = & bun install --frozen-lockfile 2>&1
          $installExitCode = $LASTEXITCODE
          $installOutput | Tee-Object -FilePath $installLog
          if ($installExitCode -eq 0) {
            Remove-Item -Force $installLog -ErrorAction SilentlyContinue
            exit 0
          }

          $installText = Get-Content $installLog -Raw
          if ($installText -notmatch '(?i)tarball|extract|download|ECONNRESET|ETIMEDOUT|EAI_AGAIN|network') {
            Write-Error "Bun dependency installation failed for a non-transient reason; not retrying."
            exit $installExitCode
          }

          Write-Host "Initial Bun install failed during package download/extraction; clearing Bun cache and retrying once..."
          bun pm cache rm
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Force $installLog -ErrorAction SilentlyContinue

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build NSIS installer
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Locate installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced."
          }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ASSET_NAME=4D-Bordro-Programi-Windows-x64-Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4D-Bordro-Programi-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Publish installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $tag = "v$version"
          $asset = "$env:INSTALLER_PATH#$env:RELEASE_ASSET_NAME"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "4D Bordro Programı $tag" `
              --notes "Windows x64 test build. Bu paket kod imzalı değildir; Windows SmartScreen uyarısı gösterebilir."
          }
