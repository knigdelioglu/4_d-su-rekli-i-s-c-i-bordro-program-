[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/payroll-core",
    "crates/payroll-wasm",
]

[profile.test.package.payroll-core]
opt-level = 2

# Keep dev and test assertions enabled by default. Only the CPU-heavy payroll
# engine is optimized in tests for the property/oracle cases; release remains
# Cargo's standard optimized profile.
