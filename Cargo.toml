[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/payroll-core",
    "crates/payroll-wasm",
]

# Keep dependency-heavy native and WASM test builds fast for every workspace
# member now that the repository has a shared root manifest.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
