[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/payroll-core",
    "crates/payroll-wasm",
]

# Keep local test code at Cargo's default opt-level=0 so assertions,
# overflow checks, and debug information remain enabled. Lightly optimize
# third-party dependencies to retain useful test throughput without the
# compile-time cost of opt-level=3.
[profile.test.package."*"]
opt-level = 1
