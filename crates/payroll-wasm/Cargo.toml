[package]
name = "payroll-wasm"
version = "0.1.0"
edition = "2021"
description = "Thin WebAssembly adapter for the portable payroll-core engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
payroll-core = { path = "../payroll-core" }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
rust_decimal = { version = "1.36", features = ["serde-float"] }
rust_decimal_macros = "1.36"
wasm-bindgen-test = "0.3"
